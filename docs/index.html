<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>icon2print — 3D chalk boxes</title>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2e0da; --accent:#d9480f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --panel:#1f1f23; --ink:#f2f2f3; --muted:#9a9aa2; --line:#2e2e34; --accent:#ff8c5a; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 16px 8px; max-width:1200px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:22px; }
  header p { margin:0; color:var(--muted); }
  header a { color:var(--accent); }
  main { display:grid; grid-template-columns:260px 1fr; gap:16px; max-width:1200px; margin:12px auto 32px; padding:0 16px; }
  @media (max-width:760px) { main { grid-template-columns:1fr; } }
  .list { display:flex; flex-direction:column; gap:6px; max-height:70vh; overflow:auto; }
  @media (max-width:760px) { .list { flex-direction:row; max-height:none; overflow-x:auto; padding-bottom:6px; } .list button { flex:0 0 auto; } }
  .list button { text-align:left; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); font:inherit; cursor:pointer; }
  .list button[aria-pressed="true"] { border-color:var(--accent); outline:1px solid var(--accent); }
  .stage { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  #view { height:min(65vh,560px); position:relative; }
  #view canvas { display:block; width:100%; height:100%; }
  #msg { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); pointer-events:none; }
  .bar { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:10px 12px; border-top:1px solid var(--line); }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { border:0; background:transparent; color:var(--ink); padding:7px 12px; font:inherit; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:#fff; }
  .meta { color:var(--muted); margin-left:auto; }
  a.dl { color:var(--accent); text-decoration:none; }
  a.dl:hover { text-decoration:underline; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  label { color:var(--muted); display:inline-flex; gap:6px; align-items:center; }
</style>
</head>
<body>
<header>
  <h1>icon2print · icon-shaped chalk boxes</h1>
  <p>Drag to rotate, scroll to zoom. Models generated by <a href="https://github.com/amadeu01/icon2print">icon2print</a> (<span id="params"></span>).</p>
</header>
<main>
  <nav class="list" id="list" aria-label="Models"></nav>
  <section class="stage">
    <div id="view"><div id="msg" role="status" aria-live="polite">Loading…</div></div>
    <div class="bar">
      <div class="seg" role="group" aria-label="Part">
        <button data-part="box" aria-pressed="true">Box</button>
        <button data-part="lid" aria-pressed="false">Lid</button>
        <button data-part="both" aria-pressed="false">Both</button>
      </div>
      <label><input type="checkbox" id="spin" checked> Auto-rotate</label>
      <span id="dl"></span>
      <span class="meta" id="meta"></span>
    </div>
  </section>
</main>

<script>
  // Plain (non-module) guard: module scripts silently do nothing on file:// or if the vendored files fail to load.
  (function () {
    var msg = document.getElementById('msg');
    if (location.protocol === 'file:') {
      msg.textContent = 'This page must be served over http(s). From the repo root run: python3 -m http.server -d docs , then open http://localhost:8000';
      return;
    }
    setTimeout(function () {
      if (!window.__viewerStarted) { msg.textContent = 'The 3D viewer did not start. Open the browser console for details, or download the STL files from the repository (docs/models).'; msg.style.display = 'grid'; }
    }, 8000);
  })();
</script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';
import { STLLoader } from './vendor/STLLoader.js';
window.__viewerStarted = true;  // all imports loaded; the guard's timeout only reports a module that never ran

const $ = (s) => document.querySelector(s);
const view = $('#view'), msg = $('#msg');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
catch (e) { msg.textContent = 'WebGL is not supported in this browser; use the downloads below.'; }
if (renderer) renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
if (renderer) { view.appendChild(renderer.domElement); renderer.domElement.setAttribute('role', 'img'); renderer.domElement.setAttribute('aria-label', '3D preview of the selected chalk box'); }
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 1, 2000);
const controls = new OrbitControls(camera, renderer ? renderer.domElement : view);
if (renderer) renderer.domElement.style.touchAction = 'pan-y'; // let phones scroll the page vertically
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x555566, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(120, -160, 220); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(-150, 100, 80); scene.add(fill);
const group = new THREE.Group(); scene.add(group);

const loader = new STLLoader();
const cache = new Map();
const load = (url) => {
  if (!cache.has(url)) cache.set(url, new Promise((res, rej) => loader.load(url, res, undefined, rej)).catch((e) => { cache.delete(url); throw e; }));
  return cache.get(url);
};
const COLORS = { box: 0xd9480f, lid: 0x2f7fd0 };

let models = [], current = null, part = 'box', token = 0;

function resize() {
  if (!renderer) return;
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const MATERIALS = Object.fromEntries(Object.entries(COLORS).map(([k, color]) =>
  [k, new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05 })]));
function mesh(geo, kind) { return new THREE.Mesh(geo, MATERIALS[kind]); }

let framedFor = null;
async function show() {
  if (!current || !renderer) return;
  const my = ++token;
  msg.textContent = 'Loading…'; msg.style.display = 'grid';
  try {
    const [boxGeo, lidGeo] = await Promise.all([load(`models/${current.slug}_box.stl`), load(`models/${current.slug}_lid.stl`)]);
    if (my !== token) return;
    group.clear();
    const items = [];
    if (part !== 'lid') items.push(mesh(boxGeo, 'box'));
    if (part !== 'box') items.push(mesh(lidGeo, 'lid'));
    const box = new THREE.Box3().setFromBufferAttribute(boxGeo.attributes.position);
    const size = box.getSize(new THREE.Vector3());
    if (part === 'both') { items[1].position.x = size.x + 15; }
    items.forEach((m) => group.add(m));
    const bb = new THREE.Box3().setFromObject(group);
    const c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
    group.position.set(-c.x, -c.y, -bb.min.z);
    const r = Math.max(s.x, s.y, s.z);
    if (framedFor !== current.slug) {  // keep the user's view when only toggling box/lid
      framedFor = current.slug;
      controls.target.set(0, 0, s.z / 2);
      camera.up.set(0, 0, 1);
      camera.position.set(r * 0.85, -r * 1.2, r * 0.95);
      controls.update();
    }
    msg.style.display = 'none';
    $('#meta').textContent = `${current.capacity_ml} ml · widest inner circle ${current.inner_mm} mm`;
    const dl = $('#dl'); dl.replaceChildren();
    ['box', 'lid'].forEach((k, i) => {
      if (i) dl.append(' · ');
      const a = document.createElement('a');
      a.className = 'dl'; a.href = `models/${encodeURIComponent(current.slug)}_${k}.stl`; a.download = ''; a.textContent = `${k}.stl`;
      dl.append(a);
    });
  } catch (e) {
    if (my !== token) return;
    msg.textContent = 'Could not load model.'; msg.style.display = 'grid'; console.error(e); }
}

function select(slug) {
  current = models.find((m) => m.slug === slug) || models[0];
  if (!current) return;
  document.querySelectorAll('#list button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.slug === current.slug));
  history.replaceState(null, '', `#${current.slug}`);
  show();
}

document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
  part = b.dataset.part;
  document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  show();
}));
$('#spin').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
$('#spin').checked = !reduce;
controls.autoRotate = !reduce; controls.autoRotateSpeed = 2;

(async () => {
  try {
    const manifest = await (await fetch('models/manifest.json')).json();
    models = manifest.models;
    $('#params').textContent = `${manifest.params.width} mm wide, ${manifest.params.height} mm tall, ${manifest.params.wall} mm walls`;
  } catch (e) { msg.textContent = `Could not load model list (${e.message}).`; msg.style.display = 'grid'; return; }
  const list = $('#list');
  for (const m of models) {
    const b = document.createElement('button');
    b.textContent = m.label; b.dataset.slug = m.slug; b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => select(m.slug));
    list.appendChild(b);
  }
  resize();
  select(location.hash.slice(1));
  addEventListener('hashchange', () => select(location.hash.slice(1)));
  if (renderer) renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
})();
</script>
</body>
</html>
